name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jurnalistik
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jurnalistik?schema=public
      JWT_SECRET: ci-test-secret-min-32-chars-123456
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install
      - run: bun --filter api prisma:generate
      - run: apps/api/node_modules/.bin/prisma validate --schema apps/api/prisma/schema.prisma
      - run: bun --filter api lint
      - run: bun --filter api build
      - run: bun --filter api prisma:deploy
      - run: bun --filter api test
      - run: bun --filter api test:e2e
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install
      - run: bun --filter admin lint
      - run: bun --filter admin test
      - run: bun --filter admin build
  image:
    # Image prod belum pernah dibuktikan build — validasi di sini agar VPS tak jadi tempat debug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t api:ci .
      - run: docker build -f apps/admin/Dockerfile -t admin:ci .
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
